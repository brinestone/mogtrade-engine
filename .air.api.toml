#:schema https://json.schemastore.org/any.json
env_files = [".env"]
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/api"

[build]
args_bin = []
bin = "./tmp/api/main"
cmd = "go build -o ./tmp/api/main ./app/cmd"
delay = 1000
entrypoint = ["./tmp/api/main"]
exclude_dir = ["worker","logs","assets", "tmp", "vendor", "smithy", "build", "testdata", ".vfox", "postman", ".postman",".vscode", "infra/scripts", "mcp"]
exclude_file = [".vfox.toml", ".gitignore"]
exclude_regex = ["_test.go", ".sql"]
exclude_unchanged = true
follow_symlink = false
full_bin = ""
ignore_dangerous_root_dir = false
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = true 
stop_on_error = false

[build.windows]
args_bin = []
bin = "tmp\\api\\main.exe"
cmd = "go build -o ./tmp/api/main.exe ./app/cmd"
entrypoint = ["tmp\\api\\main.exe"]
full_bin = ""
post_cmd = []
pre_cmd = []

[color]
app = ""
build = "yellow"
main = "magenta"
mode = ""
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = true

[misc]
clean_on_exit = true

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = true
keep_scroll = true
