version: '2'
sql:
  - engine: postgresql
    schema: infra/scripts/migrations
    queries: infra/scripts/queries
    gen:
      go:
        package: "db"
        out: infra/db 
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.numeric
            nullable: false
            go_type:
              import: github.com/shopspring/decimal
              package: decimal
              type: Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              package: decimal
              type: NullDecimal