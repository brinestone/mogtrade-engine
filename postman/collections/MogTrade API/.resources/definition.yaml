$kind: collection
description: |-
  REST API collection for the MogTrade Engine — a trading platform that lets users place trade orders on connected stock market exchanges.

  ## Base URL
  All endpoints are prefixed with `{{base_url}}/api/v1`.

  ## Authentication
  Most endpoints require a Bearer JWT access token obtained from the login endpoint.
  Pass it as: `Authorization: Bearer {{access_token}}`

  ## Headers
  - `X-D-Id`: Device ID (required for login and token refresh)
  - `X-Refresh-Token`: Refresh token (required for token rotation)
  - `X-Idempotency-Token`: Idempotency key (required for placing orders)
variables:
  base_url: http://localhost:8080
  access_token: ""
  refresh_token: ""
  device_id: postman-device-001
