$kind: http-request
method: POST
url: "{{base_url}}/api/v1/orders"
order: 3000
description: |-
  Place a new trade order. Requires KYC verification.

  **Order Types:** `market`, `limit`, `stop`, `stop_limit`
  **Order Sides:** `buy`, `sell`
  **Wallet Types:** `real`, `virtual`

  - `limitPrice` is required for `limit` and `stop_limit` orders.
  - `stopPrice` is required for `stop` and `stop_limit` orders.
  - `X-Idempotency-Token` header is required to prevent duplicate orders.
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
headers:
  - key: Content-Type
    value: application/json
  - key: X-Idempotency-Token
    value: "{{$guid}}"
    description: Unique idempotency token to prevent duplicate order submissions
body:
  type: json
  content: |-
    {
      "symbol": "BTCJPY",
      "currency": "USD",
      "type": "limit",
      "side": "buy",
      "quantity": 3,
      "limitPrice": 5,
      "walletType": "virtual"
    }
