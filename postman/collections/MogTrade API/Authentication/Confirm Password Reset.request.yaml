$kind: http-request
name: 'Confirm Password Reset'
method: GET
url: '{{base_url}}/api/v1/auth/password-reset/confirm'
order: 6000
description: |-
  Validates a password-reset token and marks it as primed so it can only be used once.
  If a `callbackUrl` was provided during the reset request, the server redirects to it with `?vt=<token>`.
queryParams:
  - key: token
    value: '<reset-token>'
    description: The raw verification token received via email
