$kind: http-request
name: 'Request Password Reset'
method: POST
url: '{{base_url}}/api/v1/auth/password-reset/request'
order: 5000
description: |-
  Initiate a password-reset flow. Sends a reset link to the supplied email address if an account exists.
  The server embeds the `callbackUrl` in the reset email with `?vt=<token>` appended.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john.doe@example.com",
      "callbackUrl": "https://app.mogtrade.com/reset-password"
    }
