$kind: http-request
method: POST
url: "{{base_url}}/api/v1/auth/register/credential"
order: 2000
description: Create a new user account using email and password credentials.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "names": "{{$randomFullName}}",
      "email": "jane@example.com",
      "password": "{{vault:password}}",
      "confirmPassword": "{{vault:password}}"
    }
