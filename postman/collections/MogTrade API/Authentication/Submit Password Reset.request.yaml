$kind: http-request
name: 'Submit Password Reset'
method: POST
url: '{{base_url}}/api/v1/auth/password-reset/submit'
order: 7000
description: |-
  Completes the password-reset flow by applying the new password.
  The verification token must have been primed via the Confirm Password Reset endpoint first.
  New password must be at least 12 characters long.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "<reset-token>",
      "new_password": "newSecurePassword123!"
    }
